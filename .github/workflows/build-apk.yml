name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'both') || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Secrets & Configuration Files
        run: |
          echo "=== 1. Preparing Environment ==="
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "✓ Copied .env.example to .env"
            else
              touch .env
              echo "✓ Created empty .env"
            fi
          fi

          echo "=== 2. Preparing Keystores ==="
          # Generate debug.keystore if missing
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ debug.keystore created."
          fi

          # Generate fallback upload keystore if not provided via secrets
          if [ ! -f "my-upload-key.jks" ] && [ -z "${{ secrets.KEYSTORE_PATH }}" ]; then
            echo "Generating fallback upload key for release builds..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -alias upload \
              -storepass android \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Release,O=OpenCode,C=CZ"
            echo "✓ my-upload-key.jks created."
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || 'my-upload-key.jks' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          echo "Building Release APK..."
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect & Inspect Artifacts
        run: |
          mkdir -p release_assets
          TAG_NAME="${GITHUB_REF_NAME:-v1.2.0}"

          echo "### 📱 OpenCode APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Type | File Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
            DEBUG_SIZE=$(du -h "$DEBUG_APK" | cut -f1)
            DEBUG_SHA=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
            cp "$DEBUG_APK" "release_assets/opencode-${TAG_NAME}-debug.apk"
            echo "| \`opencode-${TAG_NAME}-debug.apk\` | **Debug** | $DEBUG_SIZE | \`${DEBUG_SHA:0:16}...\` |" >> $GITHUB_STEP_SUMMARY
            echo "Found debug APK: $DEBUG_APK ($DEBUG_SIZE)"
          fi

          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            RELEASE_SIZE=$(du -h "$RELEASE_APK" | cut -f1)
            RELEASE_SHA=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
            cp "$RELEASE_APK" "release_assets/opencode-${TAG_NAME}-release.apk"
            echo "| \`opencode-${TAG_NAME}-release.apk\` | **Release** | $RELEASE_SIZE | \`${RELEASE_SHA:0:16}...\` |" >> $GITHUB_STEP_SUMMARY
            echo "Found release APK: $RELEASE_APK ($RELEASE_SIZE)"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Tip k instalaci**: Po stažení APK souboru z artefaktů jej můžete nainstalovat přes \`adb install -r opencode-*.apk\` nebo odeslat do zařízení Android." >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        if: ${{ always() && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ always() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
